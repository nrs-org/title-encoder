[project]
name = "title-encoder"
version = "0.1.0"
description = "Train a small JP/EN song-title encoder for softmatch retrieval"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.7",
    "sentence-transformers>=4.1",
    "transformers>=4.51",
    "datasets>=3.5",
    "accelerate>=1.6",
    "numpy>=2",
    "scikit-learn>=1.6",
    "pyarrow>=19",
    "onnx>=1.23.1",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "pykakasi>=2.3.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/title_encoder"]
